name: Issue Triaging Agent

# Thin caller: the bot's code lives in google/adk-samples
# (go/github-bots/issue-triage). This workflow only supplies adk-go's triggers,
# permissions, and the model secret; the reusable workflow runs in this repo's
# context, so the built-in GITHUB_TOKEN writes to adk-go.
#
# NOTE: pin the `uses:` ref to the merged commit SHA of the adk-samples reusable
# workflow (replace `@main`) once https://github.com/google/adk-samples/pull/2079
# lands, and add a `GEMINI_API_KEY` repository secret.

on:
  issues:
    types: [opened]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      issue:
        description: 'Triage only this issue number (blank = sweep).'
        required: false
        type: string
      dry_run:
        description: 'Log intended actions without modifying issues.'
        required: false
        type: boolean
        default: true

# One run of this bot at a time, repo-wide. Keying the group on the issue
# number would put a scheduled sweep (where the number is empty) in a
# different group from an event run for an issue that same sweep is
# processing, so the two would run concurrently -- and the bot's
# no-double-action guard is per-process, so neither can see the other.
# A queued run that GitHub drops is picked up by the next sweep.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  triage:
    if: github.repository == 'google/adk-go'
    permissions:
      issues: write
      contents: read
    uses: google/adk-samples/.github/workflows/go-issue-triage.yml@main
    with:
      # Runs the bot code from the same adk-samples commit as the workflow
      # above: the reusable workflow defaults samples_ref to its own
      # job.workflow_sha, so pinning `uses:` below pins the Go code too.
      issue_number: ${{ github.event.issue.number || inputs.issue }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      issue_count: '3'
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
